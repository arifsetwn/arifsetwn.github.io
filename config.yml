    ShowToc: false
    disableScrollToTop: true
    TocOpen: false
    ShowWordCount: false
    UseHugoToc: false
    comments: false
    math: false
    profileMode:
          enabled: true
          title: "Arif Setiawan"
          subtitle: "Dosen & Peneliti — Pendidikan Teknik Informatika (PTI), FKIP Universitas Muhammadiyah Surakarta (UMS). Fokus pada pemanfaatan AI, VR/AR, dan media digital untuk pembelajaran adaptif."
          imageUrl: picture.jpeg
          imageWidth: 150
          imageHeight: 150
          imageTitle: "Arif Setiawan, S.Kom., M.Eng."
          buttons:
            - name: Tentang
              url: tentang/
            - name: Riset & Publikasi
              url: riset/
            - name: Pengajaran & Modul
              url: pengajaran/
            - name: Kontak
              url: kontak/

    socialIcons:
        - name: Email
          url: mailto:arif.setiawan@ums.ac.id
        - name: LinkedIn
          url: https://www.linkedin.com/in/arifsetiawan90/
        - name: Google Scholar
          url: https://scholar.google.com/citations?hl=id&user=l1JmHE8AAAAJ
        - name: GitHub
          url: https://github.com/arifsetwn

