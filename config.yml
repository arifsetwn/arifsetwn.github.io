          enabled: true
          title: "Arif Setiawan"
          subtitle: "Halo, nama saya Arif Setiawan. Saya adalah Dosen di Program Studi Pendidikan Teknik Informatika di Universitas Muhammadiyah Surakarta. Perjalanan akademik saya dimulai dari gelar sarjana di Teknik Informatika UIN Sunan Kalijaga dan magister di bidang Teknologi Informasi Universitas Gadjah Mada. Saat ini, saya aktif mengajar dan melakukan penelitian tentang teknologi pendidikan, pengembangan media pembelajaran, rekayasa perangkat lunak, dan kecerdasan buatan dalam pendidikan."
          imageUrl: picture.jpeg
          imageWidth: 150
          imageHeight: 150
          imageTitle: "Arif Setiawan, S.Kom., M.Eng."
          buttons:
            - name: Tentang
