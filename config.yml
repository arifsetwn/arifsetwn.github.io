baseURL: "https://arifsetwn.github.io/"
title: "Arif Setiawan"
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

menu:
    main:
        - name: Tentang
          url: tentang/
          weight: 1
        - name: Riset
          url: riset/
          weight: 2
        - name: Pengajaran
          url: pengajaran/
          weight: 3
        - name: Kontak
          url: kontak/
          weight: 4

params:
    description: "Website pribadi dan portofolio akademik Arif Setiawan, S.Kom., M.Eng. — Dosen & Peneliti Pendidikan Teknik Informatika (PTI) FKIP Universitas Muhammadiyah Surakarta."
    author: "Arif Setiawan, S.Kom., M.Eng."
    DateFormat: January 2006
